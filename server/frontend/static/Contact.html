<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Cars Dealership</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .navbar { background: #333; overflow: hidden; }
        .navbar a { float: left; display: block; color: #f2f2f2; text-align: center; padding: 14px 16px; text-decoration: none; }
        .navbar a.active { background-color: #04AA6D; color: white; }
        .container { padding: 20px; }
        .contact-info { display: flex; gap: 20px; align-items: flex-start; }
        .contact-details { border: 1px solid #ccc; padding: 20px; flex: 1; }
        .contact-image { flex: 1; }
        .contact-image img { width: 100%; max-width: 400px; height: auto; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Home</a>
        <a href="/about">About Us</a>
        <a href="/contact" class="active">Contact Us</a>
    </div>
    <div class="container">
        <h1>Contact Us</h1>
        <div class="contact-info">
            <div class="contact-details">
                <h2>Get in Touch</h2>
                <p><strong>Address:</strong> 123 Car Street, Auto City, AC 12345</p>
                <p><strong>Phone:</strong> (555) 123-4567</p>
                <p><strong>Email:</strong> support@carsdealership.com</p>
            </div>
            <div class="contact-image">
                <img src="https://via.placeholder.com/400x300" alt="Contact Us Image">
            </div>
        </div>
    </div>
</body>
</html>
